---
layout: default
---
<section class="page-hero">
  <div class="shell page-hero__inner" data-reveal>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page-hero__lede">{{ page.subtitle }}</p>
    {% endif %}
    {% if page.hero_chips %}
      <div class="chip-row page-hero__chips" aria-label="Page highlights">
        {% for chip in page.hero_chips %}
          <span class="chip chip--muted">{{ chip }}</span>
        {% endfor %}
      </div>
    {% endif %}
  </div>
</section>

<section class="page-content">
  <div class="shell page-content__inner">
    {{ content }}
  </div>
</section>
